trigger:
- nonroot

pool:
  name: default

variables:
  buildConfiguration: Release
  publishDir: publish
  imageName: myapp
  imageTag: $(Build.BuildId)

  #ACR Settings
  acrName: demodotnet
  acrLoginServer: demodotnet.azurecr.io

stages:
- stage: Build_And_Push
  displayName: Build, Scan & Push to ACR

  jobs:
  - job: BuildDocker
    displayName: Build .NET + Docker + Trivy Scan + Push

    steps:

    # Checkout source
    - checkout: self

    # Install .NET SDK
    - task: UseDotNet@2
      inputs:
        packageType: sdk
        version: 8.0.x

    # Restore
    - script: |
        echo "Restoring dependencies..."
        dotnet restore
      displayName: Restore

    # Build
    - script: |
        echo "Building solution..."
        dotnet build --configuration $(buildConfiguration) --no-restore
      displayName: Build

    # Publish
    - script: |
        echo "Publishing application..."
        dotnet publish --configuration $(buildConfiguration) --output $(publishDir) --no-build
      displayName: Publish

    # Trivy Filesystem Scan (NON-BLOCKING)
    - script: |
        echo "Running Trivy filesystem scan..."
        trivy fs --severity HIGH,CRITICAL .
      displayName: Trivy FS Scan

    # Build Docker Image
    - script: |
        echo "Building Docker image..."
        docker build -t $(imageName):$(imageTag) .
      displayName: Docker Build

    # Trivy Image Scan (NON-BLOCKING)
    - script: |
        echo "Running Trivy image scan..."
        trivy image --scanners vuln --severity HIGH,CRITICAL $(imageName):$(imageTag)
      displayName: Trivy Image Scan

    #  Azure Login
    - task: AzureCLI@2
      displayName: Azure Login
      inputs:
        azureSubscription: 'Azure-Service-Connection' 
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          echo "Logged into Azure"

    #  EXPLICIT DOCKER LOGIN (CRITICAL FIX)
    - task: AzureCLI@2
      displayName: Docker Login to ACR
      inputs:
        azureSubscription: 'Azure-Service-Connection'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          echo "Fetching ACR credentials..."

          USERNAME=$(az acr credential show --name $(acrName) --query username -o tsv)
          PASSWORD=$(az acr credential show --name $(acrName) --query passwords[0].value -o tsv)

          echo "Logging Docker into ACR..."
          docker login $(acrLoginServer) -u $USERNAME -p $PASSWORD

    # Tag Image for ACR
    - script: |
        echo "Tagging image for ACR..."
        docker tag $(imageName):$(imageTag) $(acrLoginServer)/$(imageName):$(imageTag)
      displayName: Tag Image for ACR

    # Push Image to ACR
    - script: |
        echo "Pushing image to ACR..."
        docker push $(acrLoginServer)/$(imageName):$(imageTag)
      displayName: Push Image to ACR
