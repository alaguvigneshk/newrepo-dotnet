trigger:
- nonroot

pool:
  name: default

variables:
  buildConfiguration: Release
  publishDir: publish
  imageName: myapp
  imageTag: $(Build.BuildId)

  acrName: demodotnet
  acrLoginServer: demodotnet.azurecr.io

  aksCluster: demo-aks
  aksResourceGroup: Devops
  namespace: demo

stages:

# ================= BUILD & PUSH =================

- stage: Build_And_Push
  displayName: Build, Scan & Push to ACR

  jobs:
  - job: BuildDocker
    displayName: Build .NET + Docker + Trivy Scan + Push

    steps:
    - checkout: self

    - task: UseDotNet@2
      inputs:
        packageType: sdk
        version: 8.0.x

    - script: |
        echo "Restoring dependencies..."
        dotnet restore
      displayName: Restore

    - script: |
        echo "Building solution..."
        dotnet build --configuration $(buildConfiguration) --no-restore
      displayName: Build

    - script: |
        echo "Publishing application..."
        dotnet publish --configuration $(buildConfiguration) --output $(publishDir) --no-build
      displayName: Publish

    - script: |
        echo "Running Trivy filesystem scan..."
        trivy fs --severity HIGH,CRITICAL .
      displayName: Trivy FS Scan

    - script: |
        echo "Building Docker image..."
        docker build -t $(imageName):$(imageTag) .
      displayName: Docker Build

    - script: |
        echo "Running Trivy image scan..."
        trivy image --scanners vuln --severity HIGH,CRITICAL $(imageName):$(imageTag)
      displayName: Trivy Image Scan

    - task: AzureCLI@2
      displayName: Docker Login to ACR
      inputs:
        azureSubscription: 'Azure-Service-Connection'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          USERNAME=$(az acr credential show --name $(acrName) --query username -o tsv)
          PASSWORD=$(az acr credential show --name $(acrName) --query passwords[0].value -o tsv)

          docker login $(acrLoginServer) -u $USERNAME -p $PASSWORD

    - script: |
        echo "Tagging image for ACR..."
        docker tag $(imageName):$(imageTag) $(acrLoginServer)/$(imageName):$(imageTag)
      displayName: Tag Image

    - script: |
        echo "Pushing image to ACR..."
        docker push $(acrLoginServer)/$(imageName):$(imageTag)
      displayName: Push Image

# ================= DEPLOY TO AKS =================

- stage: Deploy_To_AKS
  displayName: Deploy to AKS
  dependsOn: Build_And_Push

  jobs:
  - job: Deploy
    displayName: Kubernetes Deployment

    steps:
    - task: AzureCLI@2
      displayName: Connect to AKS
      inputs:
        azureSubscription: 'Azure-Service-Connection'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          echo "Fetching AKS credentials..."

          az aks get-credentials \
            --resource-group $(aksResourceGroup) \
            --name $(aksCluster) \
            --overwrite-existing

          kubectl get nodes

    # ✅ ONLY ADDITION — Automatic Image Tag Injection
    - script: |
        echo "Injecting Build ID into deployment..."
        sed -i "s|__IMAGE_TAG__|$(Build.BuildId)|g" k8s/deployment.yaml
      displayName: Inject Image Tag

    - script: |
        echo "Creating namespace (safe)..."
        kubectl apply -f k8s/namespace.yaml

        echo "Deploying application..."
        kubectl apply -f k8s/deployment.yaml
        kubectl apply -f k8s/service.yaml
        kubectl apply -f k8s/ingress.yaml
      displayName: Deploy to Kubernetes
