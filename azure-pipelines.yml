trigger:
- nonroot

pool:
  name: default

variables:
  buildConfiguration: Release
  publishDir: publish
  imageName: myapp
  imageTag: $(Build.BuildId)

stages:

- stage: Build_And_Scan
  displayName: Build, Dockerize & Scan

  jobs:
  - job: BuildDocker
    displayName: Build .NET + Docker + Security Scan

    steps:

    # ✅ Checkout source
    - checkout: self

    # ✅ Ensure .NET SDK
    - task: UseDotNet@2
      inputs:
        packageType: 'sdk'
        version: '8.0.x'

    # ✅ Restore dependencies
    - script: |
        echo "Restoring dependencies..."
        dotnet restore
      displayName: Restore

    # ✅ Build solution
    - script: |
        echo "Building solution..."
        dotnet build --configuration $(buildConfiguration) --no-restore
      displayName: Build

    # ✅ Publish application
    - script: |
        echo "Publishing application..."
        dotnet publish --configuration $(buildConfiguration) \
                      --output $(publishDir) \
                      --no-build
      displayName: Publish

   


    # ✅ Build Docker Image
    - script: |
        echo "Building Docker image..."
        docker build -t $(imageName):$(imageTag) .
      displayName: Docker Build

    # ✅ Docker Diagnostics (VERY USEFUL for permission issues)
    - script: |
        echo "Docker diagnostics..."
        whoami
        groups
        ls -l /var/run/docker.sock || tr

