trigger:
- nonroot

pool:
  name: default

variables:
  buildConfiguration: Release
  publishDir: publish
  imageName: myapp
  imageTag: $(Build.BuildId)

stages:
- stage: Build_And_Scan
  displayName: Build, Dockerize & Scan

  jobs:
  - job: BuildDocker
    displayName: Build .NET + Docker + Security Scan

    steps:

    # Checkout source
    - checkout: self

    # Install .NET SDK
    - task: UseDotNet@2
      inputs:
        packageType: sdk
        version: 8.0.x

    # Restore
    - script: |
        echo "Restoring dependencies..."
        dotnet restore
      displayName: Restore

    # Build
    - script: |
        echo "Building solution..."
        dotnet build --configuration $(buildConfiguration) --no-restore
      displayName: Build

    # Publish
    - script: |
        echo "Publishing application..."
        dotnet publish --configuration $(buildConfiguration) --output $(publishDir) --no-build
      displayName: Publish

    # Trivy Filesystem Scan
    - script: |
        echo "Running Trivy filesystem scan..."
        trivy fs --exit-code 1 --severity HIGH,CRITICAL .
      displayName: Trivy FS Scan

    # Build Docker Image
    - script: |
        echo "Building Docker image..."
        docker build -t $(imageName):$(imageTag) .
      displayName: Docker Build

    # Verify Image & Variables
    - script: |
        echo "Verifying Docker image..."
        echo "Image Name: $(imageName)"
        echo "Image Tag: $(imageTag)"
        echo "Full Image: $(imageName):$(imageTag)"
        docker images
      displayName: Verify Image

    # Docker Diagnostics
    - script: |
        echo "Docker diagnostics..."
        whoami
        groups
        ls -l /var/run/docker.sock || true
        docker ps
      displayName: Docker Diagnostics
    - script: |
       echo "Checking if image exists before Trivy scan..."
       docker images
       docker images | grep $(imageName) || echo "IMAGE NOT FOUND"
      displayName: Confirm Image Exists


    # Trivy Image Scan (FIXED INDENTATION)
    - script: |
        echo "Running Trivy image scan..."
        trivy image --scanners vuln --exit-code 1 --severity HIGH,CRITICAL $(imageName):$(imageTag)
      displayName: Trivy Image Scan
