trigger:
- nonroot

pool:
  name: default

variables:
  buildConfiguration: Release
  publishDir: publish
  imageName: myapp
  imageTag: $(Build.BuildId)

  # ✅ ACR Details
  acrName: demodotnet
  acrLoginServer: demodotnet.azurecr.io

stages:
- stage: Build_And_Scan
  displayName: Build, Dockerize, Scan & Push

  jobs:
  - job: BuildDocker
    displayName: Build .NET + Docker + Security Scan

    steps:

    # Checkout source
    - checkout: self

    # Install .NET SDK
    - task: UseDotNet@2
      inputs:
        packageType: sdk
        version: 8.0.x

    # Restore
    - script: |
        echo "Restoring dependencies..."
        dotnet restore
      displayName: Restore

    # Build
    - script: |
        echo "Building solution..."
        dotnet build --configuration $(buildConfiguration) --no-restore
      displayName: Build

    # Publish
    - script: |
        echo "Publishing application..."
        dotnet publish --configuration $(buildConfiguration) --output $(publishDir) --no-build
      displayName: Publish

    # Trivy Filesystem Scan (NON-BLOCKING)
    - script: |
        echo "Running Trivy filesystem scan..."
        trivy fs --severity HIGH,CRITICAL .
      displayName: Trivy FS Scan

    # Build Docker Image
    - script: |
        echo "Building Docker image..."
        docker build -t $(imageName):$(imageTag) .
      displayName: Docker Build

    # Trivy Image Scan (NON-BLOCKING)
    - script: |
        echo "Running Trivy image scan..."
        trivy image --scanners vuln --severity HIGH,CRITICAL $(imageName):$(imageTag)
      displayName: Trivy Image Scan

    # ✅ Azure Login (via Service Connection)
    - task: AzureCLI@2
      displayName: Azure Login
      inputs:
        azureSubscription: 'Azure-Service-Connection'   # 🔴 CHANGE IF NEEDED
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          echo "Logged into Azure"

    # ✅ Login to ACR
    - task: AzureCLI@2
      displayName: ACR Login
      inputs:
        azureSubscription: 'Azure-Service-Connection'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          echo "Logging into ACR..."
          az acr login --name $(acrName)

    # ✅ Tag Image for ACR
    - script: |
        echo "Tagging image for ACR..."
        docker tag $(imageName):$(imageTag) $(acrLoginServer)/$(imageName):$(imageTag)
      displayName: Tag Image for ACR

    # ✅ Push Image to ACR
    - script: |
        echo "Pushing image to ACR..."
        docker push $(acrLoginServer)/$(imageName):$(imageTag)
      displayName: Push Image to ACR
