trigger:
- nonroot

pool:
  name: default

variables:
  buildConfiguration: Release
  imageName: myapp
  imageTag: $(Build.BuildId)

  acrLoginServer: demodotnet.azurecr.io
  aksCluster: demo-aks
  aksResourceGroup: Devops
  namespace: demo

stages:

# ================= BUILD & PUSH =================

- stage: Build_And_Push
  displayName: Build, Scan & Push Image

  jobs:
  - job: BuildDocker
    displayName: Build .NET + Docker + Scan

    steps:

    - checkout: self

    - task: UseDotNet@2
      inputs:
        packageType: sdk
        version: 8.0.x

    - script: |
        echo "Restoring dependencies..."
        dotnet restore
      displayName: Restore

    - script: |
        echo "Building solution..."
        dotnet build --configuration $(buildConfiguration) --no-restore
      displayName: Build

    - script: |
        echo "Publishing application..."
        dotnet publish --configuration $(buildConfiguration) --output publish --no-build
      displayName: Publish

    # ✅ Trivy filesystem scan (fail on critical issues)
    - script: |
        echo "Running Trivy filesystem scan..."
        trivy fs --exit-code 1 --severity HIGH,CRITICAL .
      displayName: Trivy FS Scan

    # ✅ Secure ACR login via service connection
    - task: Docker@2
      displayName: Login to ACR
      inputs:
        command: login
        containerRegistry: 'Azure-Service-Connection'

    # ✅ Build image directly with ACR name
    - script: |
        echo "Building Docker image..."
        docker build -t $(acrLoginServer)/$(imageName):$(imageTag) .
      displayName: Docker Build

    # ✅ Trivy image scan (block vulnerable images)
    - script: |
        echo "Scanning Docker image..."
        trivy image --exit-code 1 --severity HIGH,CRITICAL $(acrLoginServer)/$(imageName):$(imageTag)
      displayName: Trivy Image Scan

    - script: |
        echo "Pushing image to ACR..."
        docker push $(acrLoginServer)/$(imageName):$(imageTag)
      displayName: Push Image


# ================= DEPLOY TO AKS =================

- stage: Deploy_To_AKS
  displayName: Deploy to AKS
  dependsOn: Build_And_Push

  jobs:
  - job: Deploy
    displayName: Update Kubernetes Deployment

    steps:

    - task: AzureCLI@2
      displayName: Connect to AKS
      inputs:
        azureSubscription: 'Azure-Service-Connection'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          echo "Fetching AKS credentials..."

          az aks get-credentials \
            --resource-group $(aksResourceGroup) \
            --name $(aksCluster) \
            --overwrite-existing

          kubectl get nodes

    # ✅ Ensure namespace exists
    - script: |
        kubectl apply -f k8s/namespace.yaml
      displayName: Ensure Namespace

    # ✅ Apply manifests (safe)
    - script: |
        kubectl apply -f k8s/ -n $(namespace)
      displayName: Apply Manifests

    # ✅ CRITICAL: Update image dynamically (proper CI/CD)
    - script: |
        echo "Updating deployment image..."

        kubectl set image deployment/myapp \
          myapp=$(acrLoginServer)/$(imageName):$(imageTag) \
          -n $(namespace)

        kubectl rollout status deployment/myapp -n $(namespace)
      displayName: Update Image
