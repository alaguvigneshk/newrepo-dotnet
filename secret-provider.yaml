apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: kv-secrets
  namespace: demo  

spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    keyvaultName: "dotnetdemoo"

    objects: |
      array:
        - |
          objectName: ExternalApiKey
          objectType: secret

    tenantId: "<YOUR-TENANT-ID>"
