apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
  namespace: demo
  labels:
    app: myapp

spec:
  replicas: 2

  selector:
    matchLabels:
      app: myapp

  template:
    metadata:
      labels:
        app: myapp

    spec:
      containers:
      - name: myapp
        image: demodotnet.azurecr.io/myapp:41

        ports:
        - containerPort: 80    # ✅ MATCH REAL CONTAINER PORT

        command: ["/bin/sh"]
        args:
          - -c
          - |
            echo "Reading secret from Key Vault..."
            API_KEY=$(cat /mnt/secrets/ExternalApiKey)

            echo "Replacing placeholder in appsettings.json..."
            sed -i "s|__API_KEY__|$API_KEY|g" /app/appsettings.json

            echo "Starting application..."
            dotnet dotnet-folder.dll   # ✅ REAL DLL

        volumeMounts:
        - name: secrets-store
          mountPath: "/mnt/secrets"
          readOnly: true

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"

        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10

        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 20

      volumes:
      - name: secrets-store
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: kv-secrets
